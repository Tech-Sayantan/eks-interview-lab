{{- if .Values.daemonset.enabled -}}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "interview-app.fullname" . }}-node-reporter
  labels:
    {{- include "interview-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: node-reporter
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "interview-app.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: node-reporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "interview-app.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: node-reporter
    spec:
      tolerations:
        - operator: Exists
      containers:
        - name: node-reporter
          image: "{{ .Values.daemonset.image.repository }}:{{ .Values.daemonset.image.tag }}"
          command:
            - sh
            - -c
            - |
              while true; do
                echo "node=$NODE_NAME pod=$POD_NAME namespace=$POD_NAMESPACE"
                sleep 60
              done
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            {{- toYaml .Values.daemonset.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
{{- end }}
