{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "interview-app.fullname" . }}
  labels:
    {{- include "interview-app.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
    {{- if .Values.canary.enabled }}
    alb.ingress.kubernetes.io/actions.{{ include "interview-app.canaryActionName" . }}: >
      {"type":"forward","forwardConfig":{"targetGroups":[{"serviceName":"{{ include "interview-app.fullname" . }}","servicePort":"{{ .Values.service.port }}","weight":{{ .Values.canary.stableWeight }}},{"serviceName":"{{ include "interview-app.canaryFullname" . }}","servicePort":"{{ .Values.service.port }}","weight":{{ .Values.canary.weight }}}]}}
    {{- end }}
    {{- if .Values.ingress.certificateArn }}
    alb.ingress.kubernetes.io/certificate-arn: {{ .Values.ingress.certificateArn | quote }}
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    {{- else }}
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                {{- if $.Values.canary.enabled }}
                name: {{ include "interview-app.canaryActionName" $ }}
                port:
                  name: use-annotation
                {{- else }}
                name: {{ include "interview-app.fullname" $ }}
                port:
                  name: http
                {{- end }}
          {{- end }}
    {{- end }}
{{- end }}
