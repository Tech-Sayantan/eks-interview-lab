{{- if .Values.networkPolicy.enabled -}}
{{- if .Values.networkPolicy.defaultDeny }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "interview-app.fullname" . }}-default-deny
  labels:
    {{- include "interview-app.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "interview-app.fullname" . }}-web
  labels:
    {{- include "interview-app.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "interview-app.appSelectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.allowExternalIngressCidr }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.targetPort }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "interview-app.name" . }}
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: redis
      ports:
        - protocol: TCP
          port: 6379
    - to:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.allowHttpsEgressCidr }}
      ports:
        - protocol: TCP
          port: 443
{{- if .Values.canary.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "interview-app.canaryFullname" . }}-web
  labels:
    {{- include "interview-app.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "interview-app.canarySelectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.allowExternalIngressCidr }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.targetPort }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "interview-app.name" . }}
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: redis
      ports:
        - protocol: TCP
          port: 6379
    - to:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.allowHttpsEgressCidr }}
      ports:
        - protocol: TCP
          port: 443
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "interview-app.fullname" . }}-redis
  labels:
    {{- include "interview-app.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "interview-app.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: redis
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "interview-app.appSelectorLabels" . | nindent 14 }}
        {{- if .Values.canary.enabled }}
        - podSelector:
            matchLabels:
              {{- include "interview-app.canarySelectorLabels" . | nindent 14 }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 6379
{{- end }}
