replicaCount: 2

image:
  repository: ""
  tag: "dev"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: interview-app
  annotations: {}

podAnnotations: {}

config:
  appEnv: "dev"
  appMessage: "hello from EKS interview lab"
  awsSecretId: "interview/app/demo"

secret:
  create: true
  demoApiKey: "demo-change-me"

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: alb
  certificateArn: ""
  hosts:
    - host: app.example.com
      paths:
        - path: /
          pathType: Prefix
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
    alb.ingress.kubernetes.io/success-codes: "200"
    alb.ingress.kubernetes.io/group.name: interview-lab

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 384Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 60

networkPolicy:
  enabled: true
  defaultDeny: false
  allowExternalIngressCidr: 0.0.0.0/0
  allowHttpsEgressCidr: 0.0.0.0/0

pdb:
  enabled: true
  minAvailable: 1

storageClass:
  enabled: true
  name: interview-gp3
  type: gp3
  encrypted: "true"
  reclaimPolicy: Delete

redis:
  enabled: true
  image:
    repository: public.ecr.aws/docker/library/redis
    tag: 7.4-alpine
  replicaCount: 1
  storage:
    size: 2Gi
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 250m
      memory: 256Mi
  securityContext:
    allowPrivilegeEscalation: true

daemonset:
  enabled: true
  image:
    repository: public.ecr.aws/docker/library/busybox
    tag: 1.36
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 50m
      memory: 64Mi

resourceQuota:
  enabled: true
  hard:
    requests.cpu: "2"
    requests.memory: 4Gi
    limits.cpu: "4"
    limits.memory: 8Gi
    pods: "20"
    persistentvolumeclaims: "4"

limitRange:
  enabled: true
  default:
    cpu: 300m
    memory: 256Mi
  defaultRequest:
    cpu: 50m
    memory: 96Mi

vpa:
  enabled: false
  updateMode: "Off"

practicePvc:
  enabled: false
  size: 1Gi
